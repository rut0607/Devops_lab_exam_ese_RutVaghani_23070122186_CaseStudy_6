# Task 5 - expose the analytics pods on NodePort 30096
apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  labels:
    tier: analytics
spec:
  type: NodePort
  selector:
    app: sentiment
    tier: analytics
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30096
