# Task 5 - 2 replicas of nginx:alpine labelled tier: analytics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-deployment
  labels:
    app: sentiment
    tier: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentiment
      tier: analytics
  template:
    metadata:
      labels:
        app: sentiment
        tier: analytics
    spec:
      containers:
        - name: sentiment-worker
          image: nginx:alpine
          ports:
            - containerPort: 80
          # Declarative health validation
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
